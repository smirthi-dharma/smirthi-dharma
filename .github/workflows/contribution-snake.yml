name: Refresh profile activity
on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml', 'scripts/refresh_stats.py']
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render public activity cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_stats.py
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/github-snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVGs to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['REPOSITORY']
          for file in pathlib.Path('dist').glob('*.svg'):
              endpoint = f'repos/{repo}/contents/{file.name}'
              current = subprocess.run(['gh', 'api', endpoint + '?ref=output'], capture_output=True, text=True)
              payload = {'message': 'Refresh contribution animation', 'branch': 'output', 'content': base64.b64encode(file.read_bytes()).decode()}
              if current.returncode == 0:
                  payload['sha'] = json.loads(current.stdout)['sha']
              subprocess.run(['gh', 'api', '--method', 'PUT', endpoint, '--input', '-'], input=json.dumps(payload), text=True, check=True, stdout=subprocess.DEVNULL)
          PY
